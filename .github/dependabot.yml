version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Keep security updates trusted and frequent
    allow:
      - dependency-type: "all"
    # Group minor and patch updates together to reduce PR volume
    # Major updates create separate PRs for easier review
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Major version updates are NOT grouped and create individual PRs.
    # The auto-merge workflow skips them, so they wait for manual review.

  # Keep the pinned action SHAs in the workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Keep the Dockerfile base images up to date
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
